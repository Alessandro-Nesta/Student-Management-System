spring.application.name=SpringBootMyBatisDemo
spring.datasource.url=jdbc:mysql://localhost:3306/school?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=20031108
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 告诉 MyBatis 去哪里寻找 XML 映射文件
mybatis.mapper-locations=classpath*:/mapper/**/*.xml

# 让数据库字段 class_id 能自动映射到 Java 属性 classId
mybatis.configuration.map-underscore-to-camel-case=true
